name: Publish benchmark image

on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: dmf-benchmarks

jobs:
  publish-main-rc:
    name: publish release candidate image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact ref without external actions
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Compute RC image tag
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          tag="$(date -u +%Y%m%dT%H%M%SZ)-RC"
          echo "GHCR_OWNER=$owner" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "IMAGE_REF=ghcr.io/$owner/$IMAGE_NAME:$tag" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish RC image
        run: make image-buildx-push GHCR_OWNER="$GHCR_OWNER" IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" PUBLISH_LATEST=0

      - name: Report published RC image
        run: echo "Published $IMAGE_REF"

  publish-tagged-release:
    name: publish tagged release image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tag and main without external actions
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git fetch --force origin "refs/heads/main:refs/remotes/origin/main"
          git checkout --detach "$GITHUB_SHA"

      - name: Require tag commit to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to publish: tag $GITHUB_REF_NAME does not point to a commit reachable from main."
            exit 1
          fi

      - name: Compute release image tag
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "GHCR_OWNER=$owner" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "IMAGE_REF=ghcr.io/$owner/$IMAGE_NAME:$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish tagged release image
        run: make image-buildx-push GHCR_OWNER="$GHCR_OWNER" IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" PUBLISH_LATEST=0

      - name: Report published release image
        run: echo "Published $IMAGE_REF"
