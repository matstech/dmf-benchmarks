name: Scheduled integration

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qdrant-observability:
    name: qdrant and observability integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POETRY_NO_INTERACTION: "1"
      POETRY_VIRTUALENVS_IN_PROJECT: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DMF_BENCH_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - name: Checkout exact ref without external actions
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install Poetry
        run: python3 -m pip install "poetry==2.3.2"

      - name: Install locked dependencies
        run: poetry install --no-root --no-ansi

      - name: Build local image
        run: docker compose -f deploy/compose.yaml build artifact-api benchmark

      - name: Start local stack
        run: docker compose -f deploy/compose.yaml up -d qdrant artifact-api prometheus grafana

      - name: Run integration tests
        run: poetry run pytest tests/integration -q

      - name: Verify observability endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:9090/-/ready
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health

      - name: Stop local stack
        if: always()
        run: docker compose -f deploy/compose.yaml stop grafana prometheus artifact-api qdrant
