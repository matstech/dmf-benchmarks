name: PR fast

on:
  pull_request:
  push:
    branches:
      - main
      - bigrefactor

permissions:
  contents: read

jobs:
  offline:
    name: offline unit and contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      POETRY_NO_INTERACTION: "1"
      POETRY_VIRTUALENVS_IN_PROJECT: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact ref without external actions
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Install Poetry
        run: python3 -m pip install "poetry==2.3.2"

      - name: Install locked dependencies
        run: poetry install --all-extras --no-root --no-ansi

      - name: Package metadata check
        run: poetry check

      - name: Build standalone controller package
        run: poetry build

      - name: Exercise installed controller outside checkout
        run: |
          package_tmp="$(mktemp -d)"
          python3 -m venv "$package_tmp/venv"
          "$package_tmp/venv/bin/pip" install --no-deps dist/*.whl
          cd "$package_tmp"
          "$package_tmp/venv/bin/dmf-benchctl" config list
          "$package_tmp/venv/bin/dmf-benchctl" config export locomo-mem0 ./exported
          "$package_tmp/venv/bin/dmf-benchctl" \
            --image example.invalid/dmf-benchmarks:test --dry-run stack status
          "$package_tmp/venv/bin/dmf-benchctl" \
            --image example.invalid/dmf-benchmarks:test --dry-run \
            validate --config ./exported/experiment.json
          test -f exported/experiment.json
          test -f exported/mem0-settings.yaml

      - name: Compile package
        run: poetry run python -m compileall dmf_bench dmf_benchctl -q

      - name: Run offline tests
        run: poetry run pytest tests/unit -q

      - name: Validate CLI surfaces
        run: |
          poetry run python -m dmf_bench list
          poetry run python -m dmf_bench list-datasets
          poetry run python -m dmf_benchctl --help
