[project]
name = "dmf-benchmarks"
version = "0.2.0"
description = "Benchmark evaluation helpers for DMF."
authors = [{ name = "matstech", email = "matteo.stabile2@gmail.com" }]
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
runtime = [
    "dmf-memory (==0.3.0)",
    "mem0ai @ git+https://github.com/matstech/mem0.git@8db3430d20f8b76cb7f80fb30df048321863392f",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "pyyaml (>=6,<7)",
    "psutil (>=7,<8)",
    "qdrant-client (>=1.17,<2.0)",
    "fastapi (>=0.136,<1.0)",
    "uvicorn (>=0.46,<1.0)",
    "prometheus-client (>=0.23,<1.0)",
    "openai (>=2.30,<3.0)",
]

[project.scripts]
dmf-bench = "dmf_bench.cli:main"
dmf-benchctl = "dmf_benchctl.cli:main"

[tool.poetry]
package-mode = true
include = [
    { path = "dmf_bench/static/index.html", format = ["sdist", "wheel"] },
]
packages = [
    { include = "dmf_bench" },
    { include = "dmf_benchctl" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4,<10.0)"
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require explicitly managed local services",
]
