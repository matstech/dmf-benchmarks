[project]
name = "dmf-benchmarks"
version = "0.1.0"
description = "Benchmark evaluation helpers for DMF."
authors = [{ name = "matstech", email = "matteo.stabile2@gmail.com" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "dmf-memory[qdrant] @ git+https://github.com/matstech/dmf.git@5c4318e36120c60c1a4f4322b999f964cefa42d4",
    "mem0ai @ git+https://github.com/matstech/mem0.git@8db3430d20f8b76cb7f80fb30df048321863392f",
    "requests>=2.32,<3.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "rich (>=15,<16)",
    "python-dotenv (>=1,<2)",
    "pyyaml (>=6,<7)",
    "psutil (>=7,<8)",
    "qdrant-client (>=1.17,<2.0)",
]

[project.scripts]
dmf-bench = "dmf_bench.cli:main"

[tool.poetry]
package-mode = true
packages = [
    { include = "dmf_bench" },
    { include = "common" },
    { include = "locomo" },
    { include = "longmemeval" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4,<10.0)"
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require explicitly managed local services",
]
