[project]
name = "dmf-benchmarks"
version = "0.1.0"
description = "Benchmark evaluation helpers for DMF."
authors = [{ name = "matstech", email = "matteo.stabile2@gmail.com" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "dmf-memory @ git+ssh://git@github.com/matstech/dmf.git",
    "mem0ai @ git+https://github.com/matstech/mem0.git@8db3430d20f8b76cb7f80fb30df048321863392f",
    "requests>=2.32,<3.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
