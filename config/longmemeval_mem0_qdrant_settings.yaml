search:
  top_k: 10

vector_store:
  provider: "qdrant"
  config:
    embedding_model_dims: 768
    on_disk: false

llm:
  provider: "openai"
  config:
    model: "gpt-4o-mini"
    temperature: 0

embedder:
  provider: "fastembed"
  config:
    model: "nomic-ai/nomic-embed-text-v1.5"
    embedding_dims: 768

version: "v1.1"
