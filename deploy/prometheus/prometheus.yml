global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: benchmark
    metrics_path: /metrics
    static_configs:
      - targets:
          - benchmark:9464

  - job_name: artifact-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - artifact-api:8000

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets:
          - qdrant:6333
