services:
  benchmark:
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AMEM_EMBEDDING_MODEL_PATH: /bench/models/all-MiniLM-L6-v2
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: bind
        source: ${AMEM_MODELS_DIR:?Set AMEM_MODELS_DIR to the provisioned model directory}
        target: /bench/models
        read_only: true
